<style>
/* Layout: one-screen work tool. Dark toolbar band, tab strip, scrolling step grid, status line. */
:root{
  --bg:#e9ecf1; --panel:#ffffff; --panel2:#f5f7fa; --ink:#1b222c; --muted:#5f6b7a; --line:#d3d9e1; --line2:#e6e9ee;
  --bar:#232d3b; --bar-ink:#f3f5f8; --bar-btn:#323e50; --bar-line:#4a5870;
  --accent:#1d5fae; --accent-ink:#ffffff; --sel:#e1ecfb; --danger:#b3261e; --ok:#2e7d32; --focus:#8ab6ee;
  --scrim:rgba(18,24,33,.45);
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Cascadia Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1a2029; --panel2:#202734; --ink:#e7ebf1; --muted:#9aa5b4; --line:#323c4b; --line2:#272f3b;
  --bar:#0d1117; --bar-ink:#e7ebf1; --bar-btn:#222b38; --bar-line:#39465a;
  --accent:#4b8fe0; --accent-ink:#0b1320; --sel:#22344d; --danger:#ef8a80; --ok:#7cc47f; --focus:#4b8fe0; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --panel2:#202734; --ink:#e7ebf1; --muted:#9aa5b4; --line:#323c4b; --line2:#272f3b;
  --bar:#0d1117; --bar-ink:#e7ebf1; --bar-btn:#222b38; --bar-line:#39465a;
  --accent:#4b8fe0; --accent-ink:#0b1320; --sel:#22344d; --danger:#ef8a80; --ok:#7cc47f; --focus:#4b8fe0; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bar)}  /* so any home-indicator strip under the body matches the bottom bar, never a black gap */
@supports (height:100dvh){ body{height:100dvh} }
body{margin:0;font:13px/1.4 var(--font);color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.bar{background:var(--bar);color:var(--bar-ink);padding-top:calc(7px + env(safe-area-inset-top,0px));padding-bottom:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.bar-top{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.mark{width:20px;height:20px;flex:none}
.file{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.file .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffb020;margin-left:6px;vertical-align:middle}
.tb{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.sep{width:1px;height:22px;background:var(--bar-line);margin:0 3px}
.btn{border:1px solid var(--bar-line);background:var(--bar-btn);color:var(--bar-ink);border-radius:5px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.lbl-short{display:none}  /* phones swap to the short label (see max-width:760px) */
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:2px;padding-top:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto;flex:none}
.tabs button{border:1px solid var(--line);border-bottom:none;background:var(--panel2);padding:7px 14px;border-radius:7px 7px 0 0;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--panel);color:var(--ink);font-weight:600}
.mainwrap{flex:1;min-height:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex}
main{flex:1;min-width:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:0 7px 0 0}
.status{padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
table.grid{border-collapse:collapse;width:100%}
.grid th{position:sticky;top:0;background:var(--panel2);border-bottom:1px solid var(--line);text-align:left;font-weight:600;padding:7px 8px;z-index:2;white-space:nowrap}
.grid td{border-bottom:1px solid var(--line2);padding:6px 8px;vertical-align:top}
.grid tr.sel td{background:var(--sel)}
.grid td.num{width:44px;text-align:center;font-weight:700;color:var(--muted);cursor:pointer;user-select:none;vertical-align:middle;font-variant-numeric:tabular-nums}
.thumb{width:168px;height:100px;border:1px dashed var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;background:var(--panel2);position:relative;overflow:hidden;cursor:pointer;color:var(--muted);font-size:12px;text-align:center}
.thumb img{max-width:100%;max-height:100%;display:block}
.thumb.drop{border-color:var(--accent);border-style:solid}
.thumb .x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:3px;width:22px;height:22px;cursor:pointer;display:none}
.thumb:hover .x,.thumb:focus-within .x{display:block}
.typesel{display:flex;align-items:center;gap:6px}
select.s,input.f,textarea.cap{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:4px 6px}
textarea.cap{width:100%;min-height:72px;resize:vertical;padding:6px 8px;line-height:1.35}
.capmeta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-top:4px;flex-wrap:wrap}
.ro{max-width:560px}
input.small{width:90px}
td.c,th.c{text-align:center}
tfoot td{font-weight:600;background:var(--panel2);border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg label{padding:4px 9px;cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
.seg label:last-child{border-right:none}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--sel);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:-2px}
.chart{padding:14px 16px}
.review{padding:16px 20px;max-width:900px;line-height:1.55}
.review h2{font-size:18px;margin:10px 0 6px;text-wrap:balance}
.review ol{padding-left:28px;display:grid;gap:6px}
.review li{padding-left:4px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line)}
.chip.ok{color:var(--ok)}
.chip.miss{color:var(--muted)}
.chip.warn{color:#a15c00;border-color:#d99a3b}
.chip.stale{color:var(--danger);border-color:var(--danger)}
.esgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:6px 16px;margin-top:8px}
.revbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
h3{margin:2px 0 10px;font-size:14px}
.opts{padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.fr{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 10px;align-items:center;margin-bottom:6px}
.fr>label{color:var(--muted)}
.fr input.f,.fr select{width:100%}
.chk{display:flex;gap:7px;align-items:center;margin:4px 0}
.logoprev{height:46px;max-width:170px;border:1px solid var(--line);border-radius:4px;padding:3px;background:#fff;object-fit:contain}
.lbtn{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:4px 10px;cursor:pointer}
.lbtn:hover{background:var(--panel2)}
.lbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lbtn.danger{color:var(--danger)}
.hint{color:var(--muted);font-size:12px}
.empty{padding:48px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--bar);color:var(--bar-ink);padding:9px 14px;border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;max-width:min(560px,80vw);z-index:50}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal[hidden]{display:none!important}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.dlg h2{margin:0 0 8px;font-size:16px}
.dlg p{margin:6px 0}
.dlg textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:6px;padding:8px;font:12.5px/1.45 var(--mono);background:var(--panel2)}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.revtools{display:flex;gap:8px;align-items:center;margin:4px 0 8px;flex-wrap:wrap}
.revlist{max-height:54vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.revrow{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-bottom:1px solid var(--line2)}
.revrow:last-child{border-bottom:none}
.revrow:has(input:not(:checked)){opacity:.62}
.revck{display:flex;gap:6px;align-items:center;white-space:nowrap;font-size:12px;color:var(--muted);flex:none;cursor:pointer;user-select:none}
.revck input{width:18px;height:18px}
.revbody{flex:1;min-width:0;display:grid;gap:3px;line-height:1.4}
.revmeta{display:flex;gap:7px;align-items:center}
.revmeta svg{flex:none}
.rl{display:inline-block;min-width:34px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.revnow{color:var(--muted)}
.revnew{color:var(--ink)}
.revthumb{width:74px;height:50px;object-fit:cover;border:1px solid var(--line);border-radius:4px;flex:none}
.revthumb.nopic{display:flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--muted);font-size:10px;text-align:center}
.menu{position:absolute;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:30;min-width:240px;padding:4px 0}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:7px 12px;cursor:pointer}
.menu button:hover{background:var(--sel)}
.stepno{display:none}
.mobbar{display:none}
/* Phones and small tablets: steps become cards, toolbar swipes sideways, row tools sit at the bottom. */
@media (max-width:760px){
  body{font-size:15px}
  .bar{padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px}
  .bar-top .file{font-size:13px}
  .tb{flex-wrap:wrap;gap:6px}
  .lbl-full{display:none} .lbl-short{display:inline}
  .tb::-webkit-scrollbar{display:none}
  .tb .rowtool,.tb .sep:last-of-type{display:none}
  .btn{padding:8px 12px;font-size:14px}
  .tabs{padding-top:6px} .tabs button{padding:9px 13px}
  main{border-radius:0 7px 0 0}
  .status{display:none}
  .mobbar{display:grid;grid-template-columns:repeat(6,1fr);background:var(--bar);border-top:1px solid var(--bar-line);padding-top:3px;padding-bottom:calc(3px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);flex:none}
  .mobbar button{background:none;border:none;color:var(--bar-ink);padding:6px 2px;font-size:19px;line-height:1.1;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
  .mobbar button span{font-size:11px;opacity:.85}
  .mobbar button:disabled{opacity:.35}
  input,select,textarea,.f,.s,textarea.cap{font-size:16px!important}
  select.s,input.f{min-height:40px}
  .grid thead{display:none}
  .grid,.grid tbody,.grid tfoot{display:block;width:100%}
  .grid tr{display:flex;flex-wrap:wrap;gap:8px 10px;padding:12px 14px;border-bottom:8px solid var(--bg);background:var(--panel)}
  .grid tr.sel{box-shadow:inset 4px 0 0 var(--accent)}
  .grid tr.sel td{background:transparent}
  .grid td{display:block;border:none;padding:0;flex:1 1 100%;min-width:0}
  .grid td[data-label]::before{content:attr(data-label);display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .grid td.num{flex:1 1 100%;width:auto;text-align:left;font-size:15px;color:var(--ink);padding:2px 0}
  .stepno{display:inline}
  .grid td.half{flex:1 1 calc(50% - 5px)}
  .grid td.half select{width:100%}
  .grid td.c{flex:0 0 auto;display:flex;flex-direction:row-reverse;align-items:center;justify-content:flex-end;gap:6px;border:1px solid var(--line);border-radius:6px;padding:7px 10px}
  .grid td.c::before{margin:0!important;font-size:12px!important;text-transform:none!important;letter-spacing:0!important;color:var(--ink)!important;font-weight:500!important}
  .grid td.c input{width:20px;height:20px;margin:0}
  .grid td.ro{font-weight:500;max-width:none}
  .grid tfoot tr{border-bottom:none} .grid tfoot td:empty{display:none}
  .thumb{width:100%;height:auto;aspect-ratio:16/10;max-height:260px}
  .thumb .x{display:block;width:34px;height:34px;font-size:18px}
  .typesel{gap:8px} .typesel select{flex:1}
  textarea.cap{min-height:84px}
  .capmeta{font-size:13px}
  .seg label{padding:8px 10px}
  .opts{padding:12px} .card{padding:12px}
  .fr{grid-template-columns:1fr}
  .review{padding:14px}
  .revbar .lbtn,.lbtn{padding:8px 12px}
  .chart{padding:12px}
  .dlg{padding:14px;max-height:calc(100dvh - 32px)}
  .dlg textarea{min-height:180px}
  .toast{bottom:calc(70px + env(safe-area-inset-bottom,0px));left:16px;right:16px;max-width:none}
  .menu{left:8px!important;right:8px;min-width:0}
  .menu button{padding:12px 14px}
}
@media (max-width:760px) and (orientation:landscape){ .thumb{max-height:180px} }
/* Tablets / touch laptops (iPad included): keep the desktop table but make it finger-friendly. */
@media (pointer:coarse) and (min-width:761px){
  .thumb .x{display:block;width:30px;height:30px;font-size:17px}
  input,select,textarea,input.f,select.s,textarea.cap{font-size:16px}   /* 16px stops iOS zoom-on-focus */
  .btn{padding:7px 12px}
  .grid td{padding:9px 8px}
  .grid td.num{font-size:15px}
  .tabs button{padding:9px 16px}
  .lbtn{padding:8px 13px}
  .seg label{padding:8px 11px}
  textarea.cap{min-height:82px}
  select.s,input.f{min-height:38px}
  .menu button{padding:10px 14px}
}
/* Desktop-only on touch (phones + tablets): analysis/Spanish tabs and their toolbar actions. */
@media (pointer:coarse){ .tabs .tab-adv,.tb .adv{display:none} .tb .sep{display:none} }
.ppegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;max-height:56vh;overflow:auto;padding:2px;margin-top:4px}
.ppetile{border:2px solid var(--line);border-radius:9px;padding:9px 6px;cursor:pointer;background:var(--panel);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font:inherit}
.ppetile svg{width:54px;height:54px;flex:none}
.ppetile .pl{font-size:11px;font-weight:600;line-height:1.2}
.ppetile:hover{border-color:var(--focus)}
.ppetile.on{border-color:var(--accent);background:var(--sel)}
.ppetile.on .pl{color:var(--accent)}
@media (pointer:coarse){ .ppetile{padding:11px 6px} .ppetile svg{width:60px;height:60px} }
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>

<script>
"use strict";
/* ===================================================================== constants */
const TASK_TYPES=["Work Content","Check","Verify","Safety","Quality"];
// Types the original .soe program doesn't know: saved as their fallback type plus a <customtype> field the old program skips.
const CUSTOM_TYPES={Quality:"Safety"};
const PAGE_TYPES=["1 Picture Landscape","2 Picture Portrait","4 Picture Landscape","4 Picture Portrait","6 Picture Landscape","6 Picture Portrait","9 Picture Portrait"];

    d.template=g(p,"Template","Standard"); d.soe_title=isT(g(p,"SOETitle","true")); d.encrypt=isT(g(p,"Encrypt","false"));

    if(a){ task.wastes=Object.fromEntries(WASTES.map(w=>[w,isT(g(a,"Muda/"+w,"false"))]));
      for(const grp of ["Setup","Work"]) task[grp.toLowerCase()]=Object.fromEntries(["selected","machine","labor"].map(k=>[k,isT(g(a,grp+"/"+k,"false"))]));
      task.value_added=isT(g(a,"ValueAdded","false")); task.non_value_added=isT(g(a,"NonValueAdded","false")); task.tqc=isT(g(a,"TQC","false")); }

    for(const w of WASTES) o.push(ck(w,b(t.wastes[w])));

    o.push("</Setup><Work>"); for(const k of ["selected","machine","labor"]) o.push(ck(k,b(t.work[k])));

      cd("cycletime",t.cycletime),ck("tasktype",CUSTOM_TYPES[t.tasktype]||t.tasktype),ck("PicsPerPage",t.pics_per_page),ck("caption",t.caption),
      CUSTOM_TYPES[t.tasktype]?ck("customtype",t.tasktype):"",(t.caption_es||"").trim()?ck("caption_es",t.caption_es)+ck("caption_es_src",t.caption_es_src||""):"","</Task>");
  }

const BLACK=[0,0,0], WHITE=[1,1,1];

function shape(P,kind,x,y,r,color,number,fs){

  if(kind==="Check"){ P.poly([[x,y+r],[x+r*1.08,y-r*.78],[x-r*1.08,y-r*.78]]); ty=y-r*.3; }
  else if(kind==="Verify") P.circle(x,y,r);

      P.stroke([.53,.53,.53]); P.lw(.4); P.rect(x0,y-h,usable,h); widths.forEach((w,i)=>{ if(i) P.line(colX[i],y,colX[i],y-h); });
      cells.forEach((c,i)=>{ P.fill(BLACK);
        if(Array.isArray(c)){ let yy=y-h/2+c.length*9/2-7; for(const ln of c){ P.text(colX[i]+3,yy,ln,"reg",7.5); yy-=9; } }

        else if(i>=4){ if(c){ const cx=colX[i]+widths[i]/2, cy=y-h/2; P.stroke(BLACK); P.lw(1.3); P.o(`${n2(cx-3.2)} ${n2(cy+0.2)} m ${n2(cx-1)} ${n2(cy-2.6)} l ${n2(cx+3.6)} ${n2(cy+3)} l S`); } }
        else P.text(colX[i]+widths[i]/2,y-h/2-2.6,c,"reg",7.5,"center"); });
      P.stroke([.53,.53,.53]); y-=h; };
    drawRow(hdr,15,true);
    for(const r of pagesRows[pno-1]){ const t=r.t;
      drawRow([String(r.i+1),r.lines,t.tasktype,t.cycletime||"",X(t.value_added),X(!t.value_added&&!t.tqc),X(t.tqc),X(t.setup.selected),X(t.work.selected),
        X(t.setup.machine||t.work.machine),X(t.setup.labor||t.work.labor),...WASTES.map(w=>X(t.wastes[w]))],r.h,false,t.tasktype); }
    if(pno===pagesRows.length){
      const total=d.tasks.reduce((a,t)=>a+num(t.cycletime),0), va=d.tasks.filter(t=>t.value_added).reduce((a,t)=>a+num(t.cycletime),0);
      let s=`Total cycle time: ${total}    Value added: ${va}    Non-value added: ${total-va}`; if(total) s+=`    VA ratio: ${Math.round(va/total*100)}%`;

    }

/* ===================================================================== zip (store) for hosts that can't save .soe directly */
function crc32(b){ let c,crc=~0; const T=crc32.T||(crc32.T=Array.from({length:256},(_,n)=>{c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0;}));
  for(let i=0;i<b.length;i++) crc=T[(crc^b[i])&255]^(crc>>>8); return (~crc)>>>0; }
function zipOne(name,data){ const nb=latin1(name), crc=crc32(data); const le=(n,s)=>{const a=new Uint8Array(s);for(let i=0;i<s;i++)a[i]=(n>>>(8*i))&255;return a;};
  const local=[le(0x04034b50,4),le(20,2),le(0,2),le(0,2),le(0,2),le(0,2),le(crc,4),le(data.length,4),le(data.length,4),le(nb.length,2),le(0,2),nb];

  const csize=46+nb.length; const end=[le(0x06054b50,4),le(0,2),le(0,2),le(1,2),le(1,2),le(csize,4),le(lsize+data.length,4),le(0,2)];

// Store-only multi-file zip (photos are already JPEG, so no compression needed).
function zipMany(files){ const le=(n,s)=>{const a=new Uint8Array(s);for(let i=0;i<s;i++)a[i]=(n>>>(8*i))&255;return a;};

// Save every photo as a .zip the operator can drop into OneDrive / Files — a backup
// independent of the .soe, in case photos were taken straight into the app on a tablet.
async function backupPhotos(){
  const base=(D.name||"untitled").replace(/\.soe$/i,"");
  const files=[], seen=new Set(); let n=0;
  D.tasks.forEach((t,i)=>{ const id=t.image_id; if(!id||!D.images[id]) return;
    const num=String(i+1).padStart(2,"0");
    const slug=(t.caption||"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40);
    let name=`${num}${slug?" "+slug:""}.jpg`, k=2;
    while(seen.has(name.toLowerCase())){ name=`${num}-${k}.jpg`; k++; } seen.add(name.toLowerCase());
    files.push({name,data:b64ToBytes(D.images[id])}); n++; });
  if(D.logo_id && D.images[D.logo_id]) files.push({name:"logo.jpg",data:b64ToBytes(D.images[D.logo_id])});
  if(!n){ toast("No photos to back up yet. Add pictures to steps first.",4000); return; }
  const blob=zipMany(files);
  const r=await saveBlob(`${base} photos.zip`,blob,[{description:"Zip of photos",accept:{"application/zip":[".zip"]}}]);
  if(r.status==="saved") toast(`Backed up ${n} photo${n>1?"s":""}`+(r.download?" to your Downloads folder":"")+". Keep it in OneDrive / Files.",6000);

}

function parseSteps(text){ const steps=[], loose=[]; let title="", numbered=false;
  const typeRe=/^(work\s*content|work|check|verify|safety|quality)$/i;
  const norm=s=>{ s=s.toLowerCase().replace(/\s+/g," "); return s.startsWith("work")?"Work Content":s[0].toUpperCase()+s.slice(1); };
  for(let raw of tidy(text).split(/\r?\n/)){
    if(numbered && (/^\s*#{2,6}\s+\S/.test(raw) || /^\s*(#{1,6}\s*)?what\s+was\s+improved/i.test(raw))) break;
    let s=raw.trim().replace(/^#+\s*/,"").replace(/^\*\*(.*)\*\*$/,"$1"); if(!s) continue;
    const tm=s.match(/^title\s*:\s*(.+)$/i); if(tm){ title=tm[1].trim(); continue; }
    if(/^document\s*:/i.test(s)) continue;
    const m=s.match(/^(?:step\s*)?(\d+)\s*[.):\-]\s*(.*)$/i) || s.match(/^[-*]\s+(.*)$/);
    if(!m){ if(steps.length&&numbered) steps[steps.length-1].caption+=" "+s; else if(!/^```/.test(s)) loose.push(s); continue; }
    numbered=true;
    let body=(m.length===3?m[2]:m[1]).replace(/\*\*|__/g,"").trim(), type="Work Content";
    let b=body.match(/^\[([^\]]+)\]\s*(.*)$/) || body.match(/^\(([^)]+)\)\s*(.*)$/) || body.match(/^([A-Za-z ]{4,12})\s*:\s*(.*)$/);

const VWI_PROMPT=`Reformat these manufacturing work-instruction steps into clean Visual Work Instruction (VWI) steps. Improve HOW each step is written. Do NOT change the process, the order, or any technical detail.

PICTURES COME FIRST (most important):

OUTPUT FORMAT:

document.addEventListener("click",e=>{
  const n=e.target.closest("[data-sel]");
  if(n){ const i=+n.dataset.sel; if(e.shiftKey){ sel=new Set(); for(let k=Math.min(lastClick,i);k<=Math.max(lastClick,i);k++) sel.add(k); } else if(e.ctrlKey||e.metaKey){ sel.has(i)?sel.delete(i):sel.add(i); if(!sel.size) sel.add(i); } else sel=new Set([i]); lastClick=i; render(); return; }
  const rm=e.target.closest("[data-rmimg]"); if(rm){ e.stopPropagation(); const t=D.tasks[+rm.dataset.rmimg]; t.image_id=t.image_title=t.image_path=""; changed(true); return; }
  const im=e.target.closest("[data-img]"); if(im){ pickImageFor=+im.dataset.img; $("#imgInput").value=""; $("#imgInput").click(); return; }
  const a=e.target.closest("[data-act]"); if(a){ act(a.dataset.act,a); return; }

  if((e.key==="F5"||((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="r")) && hasWork()){ e.preventDefault(); toast("Reload is turned off while a file is open. Your work is also kept in this browser if the page closes.",4500); return; }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){ e.preventDefault(); doSave(e.shiftKey); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="o"){ e.preventDefault(); doOpen(); }
  if(e.key==="Escape"&&!$("#modal").hidden){ $("#modal").hidden=true; }
});

  else if(el.dataset.waste!=null){ D.tasks[+el.dataset.waste].wastes[el.value]=el.checked; changed(true); }

async function setImages(i,files){ files=[...files].filter(f=>f&&f.type&&f.type.startsWith("image/")); if(!files.length){ toast("That isn't a picture."); return; }
  for(let k=0;k<files.length;k++){ const idx=i+k; if(k>0) D.tasks.splice(idx,0,blankTask(D.default_ppp));
    try{ const id=await addImage(files[k]); const t=D.tasks[idx]; t.image_id=id; t.image_title=files[k].name||"pasted.jpg"; t.image_path=files[k].name||""; }catch(err){ toast("Couldn't read "+(files[k].name||"the picture")+": "+err.message,5000); } }
  changed(true); toast(files.length>1?`Added ${files.length} pictures as steps ${i+1}-${i+files.length}`:`Picture added to step ${i+1}`); }

const sorted=()=>[...sel].sort((a,b)=>a-b);
async function act(a,btn){ const T=D.tasks;
  switch(a){
    case "new": if(await confirmDiscard()) loadDoc(blankDoc()); break;
    case "open": doOpen(); break;
    case "save": doSave(false); break;
    case "saveas": doSave(true); break;
    case "pdf": doPdf("instructions"); break;
    case "pdfes": doPdf("es"); break;
    case "escopy": esCopyDialog(); break;
    case "eskeepsave": { const v=$("#esKeep").value.split(/[\n,]+/).map(x=>x.trim().toUpperCase()).filter(Boolean); ST.es_keep=[...new Set(v)]; saveSettings(); render(); toast(`Saved ${ST.es_keep.length} terms`); break; }
    case "eskeepreset": ST.es_keep=null; saveSettings(); render(); toast("Built-in list restored"); break;
    case "espaste": esPasteDialog(); break;
    case "soe": doPdf("soe"); break;
    case "backupimg": backupPhotos(); break;
    case "ppe": ppeBuilder(); break;
    case "copilot": copilotMenu(btn); break;
    case "install": pwaInstall(); break;
    case "add": T.push(blankTask(D.default_ppp)); sel=new Set([T.length-1]); if(tab==="opt") tab="vi"; changed(true); setTimeout(()=>{$("#main").scrollTop=1e9; const c=$("#cap"+(T.length-1)); c&&c.focus();},0); break;
    case "insert": { const i=sorted()[0]??0; T.splice(i,0,blankTask(D.default_ppp)); sel=new Set([i]); changed(true); break; }
    case "dup": { const ix=sorted(); const cp=ix.map(i=>JSON.parse(JSON.stringify(T[i]))); const at=ix[ix.length-1]+1; T.splice(at,0,...cp); sel=new Set(cp.map((_,k)=>at+k)); changed(true); break; }
    case "del": { const ix=sorted(); if(!ix.length) return; const removed=ix.map(i=>[i,T[i]]); ix.slice().reverse().forEach(i=>T.splice(i,1)); sel=new Set([Math.max(0,Math.min(ix[0],T.length-1))]); changed(true);
      undoDel=removed; toastUndo(`Deleted ${removed.length} row${removed.length>1?"s":""}`); break; }
    case "undo": if(undoDel){ undoDel.forEach(([i,t])=>D.tasks.splice(i,0,t)); sel=new Set(undoDel.map(x=>x[0])); undoDel=null; changed(true); toast("Restored"); } break;
    case "up": { const ix=sorted(); if(ix[0]<=0) return; ix.forEach(i=>[T[i-1],T[i]]=[T[i],T[i-1]]); sel=new Set(ix.map(i=>i-1)); changed(true); break; }
    case "down": { const ix=sorted().reverse(); if(ix[0]>=T.length-1) return; ix.forEach(i=>[T[i+1],T[i]]=[T[i],T[i+1]]); sel=new Set(ix.map(i=>i+1)); changed(true); break; }
    case "logo": $("#logoInput").value=""; $("#logoInput").click(); break;
    case "nologo": D.logo_id=""; D.logo_path=""; changed(true); break;
    case "pppall": T.forEach(t=>t.pics_per_page=D.default_ppp); changed(true); toast("Applied to all rows"); break;
    case "revcopy": { const t=reviewText(); if(await copyText(t)) toast("Copied. Paste it into Copilot (Ctrl+V).",4000);
      else modal(`<h2>Copy for Copilot</h2><p>Select all (Ctrl+A) and copy (Ctrl+C):</p><textarea readonly>${esc(t)}</textarea><div class="acts"><button class="lbtn primary" data-x>Done</button></div>`,(d,c)=>{ d.querySelector("textarea").select(); d.querySelector("[data-x]").onclick=c; }); break; }
    case "revsave": { const base=(D.name||"untitled").replace(/\.soe$/i,""); const r=await saveBlob(base+" for Copilot.txt",new Blob(["\uFEFF"+reviewText().replace(/\n/g,"\r\n")],{type:"text/plain"}),[{description:"Text",accept:{"text/plain":[".txt"]}}]); if(r.status==="saved") toast("Saved "+r.name+". Attach it in Copilot.",4000); break; }
    case "resetcolors": ST.colors={...DEFAULT_COLORS}; saveSettings(); render(); break;
  } }

function ppeLabelLines(label){ const w=label.toUpperCase().split(" "); if(w.length<2||label.length<=13) return [label.toUpperCase()];
  let a="",b=""; for(const word of w){ if((a+" "+word).trim().length<=13 && !b) a=(a+" "+word).trim(); else b=(b+" "+word).trim(); } return b?[a,b]:[a]; }
function ppeImageSVG(ids){
  const items=PPE_ITEMS.filter(p=>ids.includes(p.id)); const n=items.length;
  const cols=n<=2?n:n<=3?3:n<=4?2:n<=6?3:n<=8?4:n<=9?3:n<=12?4:5, rows=Math.ceil(n/cols);
  const TW=210, TH=200, GAP=12, PAD=16, HB=42;
  const W=PAD*2+cols*TW+(cols-1)*GAP, H=PAD*2+rows*TH+(rows-1)*GAP;
  let body="";
  items.forEach((it,i)=>{ const c=i%cols, r=Math.floor(i/cols); const x=PAD+c*(TW+GAP), y=PAD+r*(TH+GAP);
    const lines=ppeLabelLines(it.label), fs=lines.length>1?15:17;
    const labels=lines.map((ln,li)=>`<text x="${TW/2}" y="${TH-HB+ (lines.length>1?16:24) + li*16}" fill="#fff" font-family="Arial,sans-serif" font-size="${fs}" font-weight="700" text-anchor="middle">${esc(ln)}</text>`).join("");
    const isz=120, ix=(TW-isz)/2, iy=(TH-HB-isz)/2+4;
    body+=`<g transform="translate(${x},${y})"><rect width="${TW}" height="${TH}" rx="10" fill="#f3f5f8" stroke="#c9d2dc" stroke-width="1.5"/><g transform="translate(${ix},${iy}) scale(${isz/100})">${it.svg}</g><rect y="${TH-HB}" width="${TW}" height="${HB}" fill="${PPE_LBL}"/>${labels}</g>`;
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="#0d2237"/>${body}</svg>`;
}
async function svgToJpeg(svg,scale=2){
  const url=URL.createObjectURL(new Blob([svg],{type:"image/svg+xml"}));
  try{ const img=new Image(); await new Promise((res,rej)=>{ img.onload=res; img.onerror=()=>rej(new Error("render failed")); img.src=url; });
    const c=document.createElement("canvas"); c.width=(img.naturalWidth||img.width)*scale; c.height=(img.naturalHeight||img.height)*scale;
    const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    const out=await new Promise(r=>c.toBlob(r,"image/jpeg",0.92)); return new Uint8Array(await out.arrayBuffer());
  } finally{ URL.revokeObjectURL(url); } }
async function applyPPE(ids,stepIndex){ if(!ids.length) return;
  try{ const bytes=await svgToJpeg(ppeImageSVG(ids),2); const id=newId(); D.images[id]=bytesToB64(bytes);
    let t=D.tasks[stepIndex]||D.tasks[0]; if(!t){ t=blankTask(D.default_ppp); D.tasks.push(t); }
    t.image_id=id; t.image_title="Required PPE";
    if(!(t.caption||"").trim()) t.caption="Required PPE"; t.tasktype="Safety";
    changed(true); toast(`Added a Required PPE image with ${ids.length} item${ids.length>1?"s":""} to step ${(D.tasks.indexOf(t))+1}`,5000);
  }catch(e){ toast("Couldn't build the PPE image: "+e.message,5000); } }
function ppeBuilder(){
  const stepIndex=sorted()[0]??0; let picked=new Set();
  const tiles=PPE_ITEMS.map(p=>`<button type="button" class="ppetile" data-ppe="${p.id}"><svg viewBox="0 0 100 100" aria-hidden="true">${p.svg}</svg><span class="pl">${esc(p.label)}</span></button>`).join("");
  modal(`<h2>Build Required PPE image</h2>
    <p class="hint">Tap the PPE required for this job — each one snaps into a single labeled image placed on step ${stepIndex+1}.</p>
    <div class="ppegrid">${tiles}</div>
    <div class="acts"><button class="lbtn" data-x>Cancel</button><button class="lbtn primary" data-apply disabled>Add image</button></div>`,
  (d,close)=>{ const ab=d.querySelector("[data-apply]");
    const upd=()=>{ ab.disabled=!picked.size; ab.textContent=picked.size?`Add image (${picked.size})`:"Add image"; };
    d.querySelectorAll(".ppetile").forEach(t=>t.onclick=()=>{ const id=t.dataset.ppe; if(picked.has(id)){picked.delete(id);t.classList.remove("on");}else{picked.add(id);t.classList.add("on");} upd(); });
    d.querySelector("[data-x]").onclick=close;
    ab.onclick=async()=>{ const ids=PPE_ITEMS.map(p=>p.id).filter(id=>picked.has(id)); close(); await applyPPE(ids,stepIndex); };
    upd(); });
}

/* ===================================================================== PWA install prompt */
let deferredPrompt=null;
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
function setupInstall(){
  // Only in the hosted, installable PWA build (index.html links a manifest); stays hidden
  // in the single-file app and the extension editor.
  if(!document.querySelector('link[rel="manifest"]')) return;
  const btn=$("#installBtn"); if(!btn || isStandalone()) return;
  // Chrome/Edge fire this when the app meets install criteria; we show our own button.
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferredPrompt=e; btn.hidden=false; });
  window.addEventListener("appinstalled",()=>{ deferredPrompt=null; btn.hidden=true; toast("StepSheet installed"); });
  // iOS Safari never fires beforeinstallprompt and has no auto-prompt — surface the manual steps.
  if(isIOS()) btn.hidden=false;
}
function pwaInstall(){
  if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.finally(()=>{ deferredPrompt=null; const b=$("#installBtn"); if(b) b.hidden=true; }); return; }
  const ios=isIOS();
  modal(`<h2>Install StepSheet</h2>`+(ios?
    `<p>In <b>Safari</b> (Chrome/Edge on iPhone can't install apps — use Safari):</p>
     <ol style="line-height:1.9;padding-left:20px;margin:6px 0">
       <li>Tap the <b>Share</b> button (square with an up-arrow) at the bottom of Safari.</li>
       <li>Scroll down and tap <b>Add to Home Screen</b>.</li>
       <li>Tap <b>Add</b>. StepSheet opens full-screen from your home screen and works offline.</li>
     </ol>`:
    `<p>Your browser didn't offer an automatic install. You can still add StepSheet:</p>
     <ul style="line-height:1.8;padding-left:20px;margin:6px 0">
       <li><b>Chrome / Edge (computer):</b> click the <b>install icon</b> in the address bar (a monitor with a down-arrow), or open the <b>⋮</b> menu &rarr; <b>Install StepSheet…</b> (Edge: <b>Apps &rarr; Install this site as an app</b>).</li>
       <li><b>Chrome / Edge (Android):</b> <b>⋮</b> menu &rarr; <b>Add to Home screen</b> or <b>Install app</b>.</li>
       <li><b>Firefox:</b> desktop Firefox can't install web apps; on Android use <b>⋮</b> &rarr; <b>Add to Home screen</b>.</li>
     </ul>
     <p class="hint">If you don't see an install option at all, make sure you're on the https&#58;//…github.io link, not a downloaded file.</p>`)+
    `<div class="acts"><button class="lbtn primary" data-x>Got it</button></div>`,
  (d,close)=>{ d.querySelector("[data-x]").onclick=close; });
}
