<style>
/* Layout: one-screen work tool. Dark toolbar band, tab strip, scrolling step grid, status line. */
:root{
  --bg:#e9ecf1; --panel:#ffffff; --panel2:#f5f7fa; --ink:#1b222c; --muted:#5f6b7a; --line:#d3d9e1; --line2:#e6e9ee;
  --bar:#232d3b; --bar-ink:#f3f5f8; --bar-btn:#323e50; --bar-line:#4a5870;
  --accent:#1d5fae; --accent-ink:#ffffff; --sel:#e1ecfb; --danger:#b3261e; --ok:#2e7d32; --focus:#8ab6ee;
  --scrim:rgba(18,24,33,.45);
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Cascadia Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1a2029; --panel2:#202734; --ink:#e7ebf1; --muted:#9aa5b4; --line:#323c4b; --line2:#272f3b;
  --bar:#0d1117; --bar-ink:#e7ebf1; --bar-btn:#222b38; --bar-line:#39465a;
  --accent:#4b8fe0; --accent-ink:#0b1320; --sel:#22344d; --danger:#ef8a80; --ok:#7cc47f; --focus:#4b8fe0; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a2029; --panel2:#202734; --ink:#e7ebf1; --muted:#9aa5b4; --line:#323c4b; --line2:#272f3b;
  --bar:#0d1117; --bar-ink:#e7ebf1; --bar-btn:#222b38; --bar-line:#39465a;
  --accent:#4b8fe0; --accent-ink:#0b1320; --sel:#22344d; --danger:#ef8a80; --ok:#7cc47f; --focus:#4b8fe0; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
@supports (height:100dvh){ body{height:100dvh} }
body{margin:0;font:13px/1.4 var(--font);color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.bar{background:var(--bar);color:var(--bar-ink);padding-block:7px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px}
.bar-top{display:flex;align-items:center;gap:10px;min-width:0}
.brand{font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
.mark{width:20px;height:20px;flex:none}
.file{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.file .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffb020;margin-left:6px;vertical-align:middle}
.tb{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.sep{width:1px;height:22px;background:var(--bar-line);margin:0 3px}
.btn{border:1px solid var(--bar-line);background:var(--bar-btn);color:var(--bar-ink);border-radius:5px;padding:4px 9px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:2px;padding-top:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:auto;flex:none}
.tabs button{border:1px solid var(--line);border-bottom:none;background:var(--panel2);padding:7px 14px;border-radius:7px 7px 0 0;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--panel);color:var(--ink);font-weight:600}
.mainwrap{flex:1;min-height:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex}
main{flex:1;min-width:0;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:0 7px 0 0}
.status{padding-block:5px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
table.grid{border-collapse:collapse;width:100%}
.grid th{position:sticky;top:0;background:var(--panel2);border-bottom:1px solid var(--line);text-align:left;font-weight:600;padding:7px 8px;z-index:2;white-space:nowrap}
.grid td{border-bottom:1px solid var(--line2);padding:6px 8px;vertical-align:top}
.grid tr.sel td{background:var(--sel)}
.grid td.num{width:44px;text-align:center;font-weight:700;color:var(--muted);cursor:pointer;user-select:none;vertical-align:middle;font-variant-numeric:tabular-nums}
.thumb{width:168px;height:100px;border:1px dashed var(--line);border-radius:5px;display:flex;align-items:center;justify-content:center;background:var(--panel2);position:relative;overflow:hidden;cursor:pointer;color:var(--muted);font-size:12px;text-align:center}
.thumb img{max-width:100%;max-height:100%;display:block}
.thumb.drop{border-color:var(--accent);border-style:solid}
.thumb .x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:3px;width:22px;height:22px;cursor:pointer;display:none}
.thumb:hover .x,.thumb:focus-within .x{display:block}
.typesel{display:flex;align-items:center;gap:6px}
select.s,input.f,textarea.cap{border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:4px 6px}
textarea.cap{width:100%;min-height:72px;resize:vertical;padding:6px 8px;line-height:1.35}
.capmeta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-top:4px;flex-wrap:wrap}
.ro{max-width:560px}
input.small{width:90px}
td.c,th.c{text-align:center}
tfoot td{font-weight:600;background:var(--panel2);border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg label{padding:4px 9px;cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
.seg label:last-child{border-right:none}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--sel);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:-2px}
.chart{padding:14px 16px}
.review{padding:16px 20px;max-width:900px;line-height:1.55}
.review h2{font-size:18px;margin:10px 0 6px;text-wrap:balance}
.review ol{padding-left:28px;display:grid;gap:6px}
.review li{padding-left:4px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line)}
.chip.ok{color:var(--ok)}
.chip.miss{color:var(--muted)}
.chip.warn{color:#a15c00;border-color:#d99a3b}
.chip.stale{color:var(--danger);border-color:var(--danger)}
.esgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:6px 16px;margin-top:8px}
.revbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
h3{margin:2px 0 10px;font-size:14px}
.opts{padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.fr{display:grid;grid-template-columns:140px minmax(0,1fr);gap:6px 10px;align-items:center;margin-bottom:6px}
.fr>label{color:var(--muted)}
.fr input.f,.fr select{width:100%}
.chk{display:flex;gap:7px;align-items:center;margin:4px 0}
.logoprev{height:46px;max-width:170px;border:1px solid var(--line);border-radius:4px;padding:3px;background:#fff;object-fit:contain}
.lbtn{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:4px 10px;cursor:pointer}
.lbtn:hover{background:var(--panel2)}
.lbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lbtn.danger{color:var(--danger)}
.hint{color:var(--muted);font-size:12px}
.empty{padding:48px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--bar);color:var(--bar-ink);padding:9px 14px;border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;max-width:min(560px,80vw);z-index:50}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal[hidden]{display:none!important}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.dlg h2{margin:0 0 8px;font-size:16px}
.dlg p{margin:6px 0}
.dlg textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:6px;padding:8px;font:12.5px/1.45 var(--mono);background:var(--panel2)}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.menu{position:absolute;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:30;min-width:240px;padding:4px 0}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:7px 12px;cursor:pointer}
.menu button:hover{background:var(--sel)}
.stepno{display:none}
.mobbar{display:none}
/* Phones and small tablets: steps become cards, toolbar swipes sideways, row tools sit at the bottom. */
@media (max-width:760px){
  body{font-size:15px}
  .bar{padding-block:6px}
  .bar-top .file{font-size:13px}
  .tb{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-inline:-4px;padding-inline:4px;padding-bottom:2px}
  .tb::-webkit-scrollbar{display:none}
  .tb .rowtool,.tb .sep:last-of-type{display:none}
  .btn{padding:8px 12px;font-size:14px}
  .tabs{padding-top:6px} .tabs button{padding:9px 13px}
  main{border-radius:0 7px 0 0}
  .status{display:none}
  .mobbar{display:grid;grid-template-columns:repeat(6,1fr);background:var(--bar);border-top:1px solid var(--bar-line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);flex:none}
  .mobbar button{background:none;border:none;color:var(--bar-ink);padding:7px 2px 6px;font-size:17px;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  .mobbar button span{font-size:11px;opacity:.85}
  .mobbar button:disabled{opacity:.35}
  input,select,textarea,.f,.s,textarea.cap{font-size:16px!important}
  select.s,input.f{min-height:40px}
  .grid thead{display:none}
  .grid,.grid tbody,.grid tfoot{display:block;width:100%}
  .grid tr{display:flex;flex-wrap:wrap;gap:8px 10px;padding:12px 14px;border-bottom:8px solid var(--bg);background:var(--panel)}
  .grid tr.sel{box-shadow:inset 4px 0 0 var(--accent)}
  .grid tr.sel td{background:transparent}
  .grid td{display:block;border:none;padding:0;flex:1 1 100%;min-width:0}
  .grid td[data-label]::before{content:attr(data-label);display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .grid td.num{flex:1 1 100%;width:auto;text-align:left;font-size:15px;color:var(--ink);padding:2px 0}
  .stepno{display:inline}
  .grid td.half{flex:1 1 calc(50% - 5px)}
  .grid td.half select{width:100%}
  .grid td.c{flex:0 0 auto;display:flex;flex-direction:row-reverse;align-items:center;justify-content:flex-end;gap:6px;border:1px solid var(--line);border-radius:6px;padding:7px 10px}
  .grid td.c::before{margin:0!important;font-size:12px!important;text-transform:none!important;letter-spacing:0!important;color:var(--ink)!important;font-weight:500!important}
  .grid td.c input{width:20px;height:20px;margin:0}
  .grid td.ro{font-weight:500;max-width:none}
  .grid tfoot tr{border-bottom:none} .grid tfoot td:empty{display:none}
  .thumb{width:100%;height:auto;aspect-ratio:16/10;max-height:260px}
  .thumb .x{display:block;width:34px;height:34px;font-size:18px}
  .typesel{gap:8px} .typesel select{flex:1}
  textarea.cap{min-height:84px}
  .capmeta{font-size:13px}
  .seg label{padding:8px 10px}
  .opts{padding:12px} .card{padding:12px}
  .fr{grid-template-columns:1fr}
  .review{padding:14px}
  .revbar .lbtn,.lbtn{padding:8px 12px}
  .chart{padding:12px}
  .dlg{padding:14px;max-height:calc(100dvh - 32px)}
  .dlg textarea{min-height:180px}
  .toast{bottom:calc(70px + env(safe-area-inset-bottom,0px));left:16px;right:16px;max-width:none}
  .menu{left:8px!important;right:8px;min-width:0}
  .menu button{padding:12px 14px}
}
@media (max-width:760px) and (orientation:landscape){ .thumb{max-height:180px} }
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>

function parseSoe(text){
  const x=new DOMParser().parseFromString(text,"application/xml");
  if(x.getElementsByTagName("parsererror").length) throw new Error("This doesn't look like a .soe work instruction file.");
  const kid=(el,name)=>el?[...el.children].find(c=>c.tagName===name):null;
  const g=(el,path,def="")=>{ let e=el; for(const p of path.split("/")){ e=kid(e,p); if(!e) return def; } return e.textContent; };
  const root=x.documentElement, m=kid(root,"mainroot");
  if(!m) throw new Error("This file has no work instruction data in it.");
  const d=blankDoc(); d.tasks=[];
  d.version=g(m,"version","4.0"); d.name=g(m,"FileInfo/name","untitled.soe"); d.url=g(m,"FileInfo/url","");
  const p=kid(m,"FileProperties");
  if(p){ for(const k in HEADER_LABELS){ d.header[k]=g(p,k,""); d.header_es[k]=g(p,k+"_es",""); }
    d.advanced=isT(g(p,"Advanced","true")); d.borders=isT(g(p,"Borders","true")); d.shapes=isT(g(p,"Shapes","true"));
    d.template=g(p,"Template","Standard"); d.soe_title=isT(g(p,"SOETitle","true")); d.encrypt=isT(g(p,"Encrypt","false"));
    d.password=g(p,"password",""); for(const k of SECURITY_FLAGS) d.security[k]=g(p,k,"");
    d.font=g(p,"Font","helvetica"); d.default_ppp=g(p,"DefaultPPP","4 Picture Landscape");
    d.logo_path=g(p,"logo/imagepath",""); d.logo_id=g(p,"logo/imageid",""); }
  const fd=kid(m,"FileData");
  for(const t of (fd?[...fd.children].filter(c=>c.tagName==="Task"):[])){
    const a=kid(t,"Analysis"); const task=blankTask(d.default_ppp);
    Object.assign(task,{caption:g(t,"caption"),tasktype:g(t,"tasktype","Work Content"),pics_per_page:g(t,"PicsPerPage",d.default_ppp),cycletime:g(t,"cycletime"),
      image_id:g(t,"VmsInfo/imageid"),image_title:g(t,"VmsInfo/imagetitle"),image_path:g(t,"VmsInfo/imagepath"),font_size:g(t,"VmsInfo/FontSize","12")});
    const ct=g(t,"customtype").trim(); if(CUSTOM_TYPES[ct]) task.tasktype=ct;
    task.caption_es=g(t,"caption_es"); task.caption_es_src=g(t,"caption_es_src");
    if(a){ task.wastes=Object.fromEntries(WASTES.map(w=>[w,isT(g(a,"Muda/"+w,"false"))]));
      for(const grp of ["Setup","Work"]) task[grp.toLowerCase()]=Object.fromEntries(["selected","machine","labor"].map(k=>[k,isT(g(a,grp+"/"+k,"false"))]));
      task.value_added=isT(g(a,"ValueAdded","false")); task.non_value_added=isT(g(a,"NonValueAdded","false")); task.tqc=isT(g(a,"TQC","false")); }
    d.tasks.push(task); }
  const imgs=kid(kid(root,"imageroot"),"images");
  if(imgs) for(const e of imgs.children){ const b=e.textContent.replace(/\s+/g,""); if(b) d.images[e.tagName]=b; }
  return d;
}
function serializeSoe(d){
  const cdv=v=>String(v??"").replace(/]]>/g,"]]]]><![CDATA[>");
  const cd=(t,v)=>{ v=String(v??""); return v===""?`<${t}/>`:`<${t}><![CDATA[${cdv(tidy(v))}]]></${t}>`; };
  const ck=(t,v)=>`<${t}><![CDATA[${cdv(tidy(v))}]]></${t}>`;
  const b=v=>v?"true":"false";
  const o=['<?xml version="1.0" encoding="ISO-8859-1"?><roots><mainroot>'];
  o.push(ck("version",d.version||"4.0"),"<FileInfo>",ck("name",d.name),ck("url",d.url),"</FileInfo><FileProperties>");
  for(const k in HEADER_LABELS) o.push(ck(k,d.header[k]||""));
  o.push(ck("Advanced",b(d.advanced)),ck("Borders",b(d.borders)),ck("Shapes",b(d.shapes)),ck("Template",d.template||"Standard"),ck("SOETitle",b(d.soe_title)),ck("Encrypt",b(d.encrypt)),cd("password",d.password));
  for(const k of SECURITY_FLAGS) o.push(cd(k,d.security[k]||""));
  o.push(ck("Font",d.font||"helvetica"),ck("DefaultPPP",d.default_ppp),"<logo>",cd("imagepath",d.logo_path),cd("imageid",d.logo_id),"</logo>",...Object.keys(HEADER_LABELS).map(k=>(d.header_es&&d.header_es[k]||"").trim()?ck(k+"_es",d.header_es[k]):""),"</FileProperties>",ck("isDirty","false"),"<FileData>");
  for(const t of d.tasks){
    o.push("<Task><VmsInfo>",cd("imagetitle",t.image_title),cd("imagepath",t.image_path),cd("imageid",t.image_id),ck("FontSize",t.font_size||"12"),"</VmsInfo><Analysis><Muda>");
    for(const w of WASTES) o.push(ck(w,b(t.wastes[w])));
    o.push("</Muda><Setup>"); for(const k of ["selected","machine","labor"]) o.push(ck(k,b(t.setup[k])));
    o.push("</Setup><Work>"); for(const k of ["selected","machine","labor"]) o.push(ck(k,b(t.work[k])));
    o.push("</Work>",ck("ValueAdded",b(t.value_added)),ck("NonValueAdded",b(t.non_value_added)),ck("TQC",b(t.tqc)),"</Analysis>",
      cd("cycletime",t.cycletime),ck("tasktype",CUSTOM_TYPES[t.tasktype]||t.tasktype),ck("PicsPerPage",t.pics_per_page),ck("caption",t.caption),
      CUSTOM_TYPES[t.tasktype]?ck("customtype",t.tasktype):"",(t.caption_es||"").trim()?ck("caption_es",t.caption_es)+ck("caption_es_src",t.caption_es_src||""):"","</Task>");
  }
  o.push("</FileData></mainroot><imageroot><images>");
  const used=new Set(d.tasks.map(t=>t.image_id).filter(Boolean)); if(d.logo_id) used.add(d.logo_id);
  for(const [id,b64] of Object.entries(d.images)){ if(!used.has(id)) continue; o.push(`<${id}>`,b64.replace(/.{76}/g,"$&\n").replace(/\n$/,""),`\n</${id}>`); }
  o.push("</images></imageroot></roots>");
  return latin1(o.join(""));
}

async function toJpeg(blob, maxPx, q=0.85){ // decode any picture, shrink if needed, re-encode as JPEG
  const bmp=await createImageBitmap(blob,{imageOrientation:"from-image"});
  let w=bmp.width,h=bmp.height; if(maxPx && Math.max(w,h)>maxPx){ const k=maxPx/Math.max(w,h); w=Math.round(w*k); h=Math.round(h*k); }
  const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(bmp,0,0,w,h); bmp.close?.();
  const out=await new Promise(r=>c.toBlob(r,"image/jpeg",q)); return new Uint8Array(await out.arrayBuffer());
}
async function addImage(file){ const bytes=await toJpeg(file,(QUALITY_PX[ST.image_quality]||1400)+200); const id=newId(); D.images[id]=bytesToB64(bytes); return id; }
function jpegInfo(b){ // width, height, components from the SOF marker
  let i=2; while(i<b.length){ if(b[i]!==0xFF){i++;continue;} const m=b[i+1]; const len=(b[i+2]<<8)|b[i+3];
    if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC) return {h:(b[i+5]<<8)|b[i+6],w:(b[i+7]<<8)|b[i+8],c:b[i+9]};
    if(m===0xD8||m===0x01||(m>=0xD0&&m<=0xD7)){i+=2;continue;} i+=2+len; } return null; }
const pdfImgCache=new Map();
async function pdfImage(id){
  if(!id||!D.images[id]) return null;
  const key=id+"|"+ST.image_quality; if(pdfImgCache.has(key)) return pdfImgCache.get(key);
  let bytes=b64ToBytes(D.images[id]); let info=jpegInfo(bytes); const max=QUALITY_PX[ST.image_quality];
  try{ if(!info || (max && Math.max(info.w,info.h)>max) || info.c===4){ bytes=await toJpeg(new Blob([bytes]),max||0); info=jpegInfo(bytes); } }catch(e){ if(!info) return null; }
  const r=info?{bytes,...info}:null; pdfImgCache.set(key,r); return r;
}

    const info=obj(`<< /Title ${pstr(title||"")} /Producer (StepSheet) /Creator (StepSheet) >>`);
    push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
    objs.forEach((b,i)=>{ offs[i]=len; push(`${i+1} 0 obj\n`); if(typeof b==="string") push(b); else { push(b.head); push(b.bytes); push(b.tail); } push("\nendobj\n"); });
    const xref=len; push(`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join(""));
    push(`trailer\n<< /Size ${objs.length+1} /Root 1 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    return new Blob(parts,{type:"application/pdf"});
  }
}

/* ===================================================================== PDF layout (matches the original .soe program's output) */
const BLACK=[0,0,0], WHITE=[1,1,1];
function pal(k){ return hexRGB((ST.colors||{})[k]||DEFAULT_COLORS[k]||"#000000"); }
function fit(s,font,size,width){ while(size>5 && tw(s,font,size)>width) size-=0.5; return size; }
function shape(P,kind,x,y,r,color,number,fs){
  P.o("q"); P.stroke(color); P.fill(WHITE); P.lw(Math.max(1.8,r*0.26)); let ty=y;
  if(kind==="Check"){ P.poly([[x,y+r],[x+r*1.08,y-r*.78],[x-r*1.08,y-r*.78]]); ty=y-r*.3; }
  else if(kind==="Verify") P.circle(x,y,r);
  else if(kind==="Safety") P.poly([[x,y+r*1.1],[x+r*1.1,y],[x,y-r*1.1],[x-r*1.1,y]]);
  else if(kind==="Quality"){ const R=r*1.1; const pts=[]; for(let k=0;k<8;k++){ const t=Math.PI/8+k*Math.PI/4; pts.push([x+R*Math.cos(t),y+R*Math.sin(t)]); } P.poly(pts); }
  else P.rect(x-r*.9,y-r*.9,r*1.8,r*1.8,"B");
  if(number!=null){ const L=String(number).length; if(kind==="Check"&&L>1) fs*= L===2?0.78:0.62; if(kind==="Quality"&&L>2) fs*=0.8; P.fill(BLACK); P.text(x,ty-fs*.35,String(number),"bold",fs,"center"); }
  P.o("Q");

function cellText(P,txt,x,y,w,h,font,size,align="left"){

  while(true){ lines=split(txt,font,size,w-6); if(lines.length*size*1.1<=h-2||size<=5) break; size-=0.5; }
  let yy=y+h/2+lines.length*size*1.1/2-size; P.fill(BLACK);
  for(const ln of lines){ if(align==="center") P.text(x+w/2,yy,ln,font,size,"center"); else P.text(x+4,yy,ln,font,size); yy-=size*1.1; }
}
function pdfHeader(P,d,W,H,logo,lang){

  if(lang==="es"){ const tag="ESPAÑOL", tw_=tw(tag,"bold",10)+16; P.fill(BLACK); P.rect(x1-tw_,top-24,tw_,18,"f"); P.fill(WHITE); P.text(x1-tw_/2,top-19,tag,"bold",10,"center"); P.fill(BLACK); }
  const lw=96*s+20, lh=30;
  if(logo){ const k=Math.min(lw/logo.w,lh/logo.h); P.image(logo,18,top-10-lh+(lh-logo.h*k)/2,logo.w*k,logo.h*k); }
  P.fill(BLACK); const title=h.udc1||""; const fs=fit(title,"bold",18,x1-x0-2*(lw+20)); P.text(W/2,top-18,title,"bold",fs,"center");
  if((h.udc2||"").trim()) P.text(W/2,top-32,h.udc2.trim(),"reg",10,"center");
  const useQ=d.tasks.some(t=>t.tasktype==="Quality"); const rh=24, ty=top-56, cw1=118*s, legendW=(W>H?272*s:250)+(useQ?(W>H?70*s:62):0);
  P.stroke(BLACK); P.lw(1); P.rect(x0,ty-2*rh,x1-x0,2*rh); P.line(x0,ty-rh,x1,ty-rh); P.line(x0+cw1,ty,x0+cw1,ty-2*rh);

  const items=["Check","Work Content","Verify","Safety",...(useQ?["Quality"]:[])], lfs=W>H?10:8.5; const ws=items.map(i=>tw(lang==="es"?TYPE_ES[i]:i,"bold",lfs)+22);

function pdfFooter(P,d,W,pno,count,pdfName,dateText,lang){

async function buildInstructions(d,pdfName,progress,lang){
  const P=new PDF(); const logo=await pdfImage(d.logo_id); const pages=groupPages(d.tasks); if(!pages.length) pages.push(["4 Picture Landscape",[]]);

    const [layout,idxs]=pages[pno-1]; const [cols,rows,orient]=LAYOUTS[layout]; const W=orient==="L"?792:612, H=orient==="L"?612:792;
    P.addPage(W,H); const bodyTop=pdfHeader(P,d,W,H,logo,lang)-7, bodyBot=30, gap=7, x0=10, x1=W-10;
    const cw=(x1-x0-gap*(cols-1))/cols, ch=(bodyTop-bodyBot-gap*(rows-1))/rows, dense=cols*rows>=6;
    for(let k=0;k<idxs.length;k++){
      const ti=idxs[k], t=d.tasks[ti], col=k%cols, row=Math.floor(k/cols); const x=x0+col*(cw+gap), y=bodyTop-(row+1)*ch-row*gap;

      P.stroke(BLACK); P.lw(1); P.rect(ix,iy,iw,ih); P.line(ix,iy+ih-topH,ix+iw,iy+ih-topH); P.line(ix+shapeW,iy+ih,ix+shapeW,iy+ih-topH);
      P.line(ix+iw-sideW,iy+ih,ix+iw-sideW,iy+ih-topH); P.line(ix+iw-sideW,iy+ih-topH/2,ix+iw,iy+ih-topH/2);
      const r=topH*.3;
      if(d.shapes) shape(P,t.tasktype,ix+shapeW/2,iy+ih-topH/2,r,accent,ti+1,Math.max(7,r*.95));
      else { P.fill(BLACK); P.text(ix+shapeW/2,iy+ih-topH/2-r*.35,String(ti+1),"bold",Math.max(7,r),"center"); }
      const capW=iw-shapeW-sideW-6; let fsz=Math.min(num(t.font_size)||12,12)*(dense?.75:1), lines;
      const capText=(lang==="es"&&(t.caption_es||"").trim())?t.caption_es.trim():(t.caption||"").trim();
      while(true){ lines=split(capText,"reg",fsz,capW); if(lines.length*fsz*1.02<=topH-2||fsz<=5) break; fsz-=0.5; }
      P.fill(BLACK); let yy=iy+ih-fsz*.95; for(const ln of lines){ P.text(ix+shapeW+4,yy,ln,"reg",fsz); yy-=fsz*1.02; }
      if((t.cycletime||"").trim()) P.text(ix+iw-sideW/2,iy+ih-topH/2+topH/4-2.5,t.cycletime.trim(),"reg",7,"center");
      const img=await pdfImage(t.image_id);
      if(img){ const ax=ix+2, ay=iy+2, aw=iw-4, ah=ih-topH-4, s=Math.min(aw/img.w,ah/img.h); P.image(img,ax+(aw-img.w*s)/2,ay+(ah-img.h*s)/2,img.w*s,img.h*s); }

async function buildSoe(d,pdfName){
  const P=new PDF(); const logo=await pdfImage(d.logo_id); const W=792,H=612;
  const hdr=["#","Task","Type","Cycle","VA","NVA","C&V","Setup","Work","Mach.","Labor","OvrP","OvrPr","Wait","Trans","Inv","Move","Def"];
  let widths=[20,290,62,34,...Array(7).fill(26),...Array(7).fill(28)]; const usable=W-20; const sc=usable/widths.reduce((a,b)=>a+b,0); widths=widths.map(w=>w*sc);
  const rows=d.tasks.map((t,i)=>{ const lines=split((t.caption||"").trim(),"reg",7.5,widths[1]-6); return {i,t,lines,h:Math.max(15,lines.length*9+6)}; });
  const pagesRows=[]; let cur=[], used=0; const avail=H-60-56-30-40;
  for(const r of rows){ if(used+r.h>avail && cur.length){ pagesRows.push(cur); cur=[]; used=0; } cur.push(r); used+=r.h; } pagesRows.push(cur);
  const X=t=>t?"4":"";
  for(let pno=1;pno<=pagesRows.length;pno++){
    P.addPage(W,H); const top=pdfHeader(P,d,W,H,logo); let y=top-10; const x0=10;
    const colX=[]; widths.reduce((a,w,i)=>{ colX[i]=a; return a+w; },x0);
    const drawRow=(cells,h,isHead,fillType)=>{
      if(isHead){ P.fill([.91,.91,.91]); P.rect(x0,y-h,usable,h,"f"); }
      if(fillType){ P.fill(mix(pal(fillType),.35)); P.rect(colX[2],y-h,widths[2],h,"f"); }
      P.stroke([.53,.53,.53]); P.lw(.4); P.rect(x0,y-h,usable,h); widths.forEach((w,i)=>{ if(i) P.line(colX[i],y,colX[i],y-h); });
      cells.forEach((c,i)=>{ P.fill(BLACK);
        if(Array.isArray(c)){ let yy=y-h/2+c.length*9/2-7; for(const ln of c){ P.text(colX[i]+3,yy,ln,"reg",7.5); yy-=9; } }
        else if(isHead) P.text(colX[i]+(i===1?3:widths[i]/2),y-h/2-2.5,c,"bold",7,i===1?"left":"center");
        else if(i>=4){ if(c){ const cx=colX[i]+widths[i]/2, cy=y-h/2; P.stroke(BLACK); P.lw(1.3); P.o(`${n2(cx-3.2)} ${n2(cy+0.2)} m ${n2(cx-1)} ${n2(cy-2.6)} l ${n2(cx+3.6)} ${n2(cy+3)} l S`); } }
        else P.text(colX[i]+widths[i]/2,y-h/2-2.6,c,"reg",7.5,"center"); });
      P.stroke([.53,.53,.53]); y-=h; };
    drawRow(hdr,15,true);
    for(const r of pagesRows[pno-1]){ const t=r.t;
      drawRow([String(r.i+1),r.lines,t.tasktype,t.cycletime||"",X(t.value_added),X(!t.value_added&&!t.tqc),X(t.tqc),X(t.setup.selected),X(t.work.selected),
        X(t.setup.machine||t.work.machine),X(t.setup.labor||t.work.labor),...WASTES.map(w=>X(t.wastes[w]))],r.h,false,t.tasktype); }
    if(pno===pagesRows.length){
      const total=d.tasks.reduce((a,t)=>a+num(t.cycletime),0), va=d.tasks.filter(t=>t.value_added).reduce((a,t)=>a+num(t.cycletime),0);
      let s=`Total cycle time: ${total}    Value added: ${va}    Non-value added: ${total-va}`; if(total) s+=`    VA ratio: ${Math.round(va/total*100)}%`;
      P.fill(BLACK); P.text(x0,y-22,s,"bold",9);
      P.text(x0,y-35,"Wastes flagged:  "+WASTES.map(w=>`${WASTE_NAMES[w]}: ${d.tasks.filter(t=>t.wastes[w]).length}`).join("   "),"reg",8);
    }
    pdfFooter(P,d,W,pno,pagesRows.length,pdfName,ST.add_date?today():"");
  }
  return P.build((d.header.udc1||d.name)+" - SOE");
}

/* ===================================================================== zip (store) for hosts that can't save .soe directly */
function crc32(b){ let c,crc=~0; const T=crc32.T||(crc32.T=Array.from({length:256},(_,n)=>{c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;return c>>>0;}));
  for(let i=0;i<b.length;i++) crc=T[(crc^b[i])&255]^(crc>>>8); return (~crc)>>>0; }
function zipOne(name,data){ const nb=latin1(name), crc=crc32(data); const le=(n,s)=>{const a=new Uint8Array(s);for(let i=0;i<s;i++)a[i]=(n>>>(8*i))&255;return a;};
  const local=[le(0x04034b50,4),le(20,2),le(0,2),le(0,2),le(0,2),le(0,2),le(crc,4),le(data.length,4),le(data.length,4),le(nb.length,2),le(0,2),nb];
  const lsize=30+nb.length; const central=[le(0x02014b50,4),le(20,2),le(20,2),le(0,2),le(0,2),le(0,2),le(0,2),le(crc,4),le(data.length,4),le(data.length,4),le(nb.length,2),le(0,2),le(0,2),le(0,2),le(0,2),le(0,4),le(0,4),nb];
  const csize=46+nb.length; const end=[le(0x06054b50,4),le(0,2),le(0,2),le(1,2),le(1,2),le(csize,4),le(lsize+data.length,4),le(0,2)];
  return new Blob([...local,data,...central,...end],{type:"application/zip"}); }

/* ===================================================================== file I/O */
let D=blankDoc(), fileHandle=null, dirty=false;
const hasFSA=()=>typeof window.showOpenFilePicker==="function";
let downloadsP=null; const inClaude=()=>!!(window.claude&&window.claude.use);
async function claudeDownloads(){ if(!inClaude()) return null; if(!downloadsP) downloadsP=window.claude.use("downloads").catch(()=>null); return downloadsP; }
function anchorSave(name,blob){ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),30000); }
async function saveBlob(name,blob,types){ // returns "saved" | "cancelled" | "failed"
  if(typeof window.showSaveFilePicker==="function" && !inClaude()){
    try{ const h=await window.showSaveFilePicker({suggestedName:name,types}); const w=await h.createWritable(); await w.write(blob); await w.close(); return {status:"saved",handle:h,name:h.name}; }
    catch(e){ if(e.name==="AbortError") return {status:"cancelled"}; }
  }
  const dl=await claudeDownloads();
  if(dl){ const ext=name.split(".").pop().toLowerCase(); let fname=name, data=blob;
    if(!["pdf","csv","txt","zip"].includes(ext)){ data=zipOne(name,new Uint8Array(await blob.arrayBuffer())); fname=name+".zip"; }
    try{ await dl.save({filename:fname,data}); return {status:"saved",zipped:fname!==name,name:fname}; }
    catch(e){ if(e&&e.code==="declined") return {status:"cancelled"}; toast("This view can't save files: "+(e&&e.message||e),5000); return {status:"failed"}; } }
  anchorSave(name,blob); return {status:"saved",name,download:true};
}
async function readSoeFile(file){ const buf=await file.arrayBuffer(); const text=new TextDecoder("iso-8859-1").decode(buf); const d=parseSoe(text); d.name=file.name||d.name; return d; }
function loadDoc(d,handle){ clearURLs(); D=d; fileHandle=handle||null; dirty=false; sel=new Set([0]); lastClick=0; render(); scheduleDraft(true); }
async function doOpen(){
  if(!(await confirmDiscard())) return;
  if(hasFSA() && !inClaude()){
    try{ const [h]=await window.showOpenFilePicker({types:[{description:"SOE work instruction files",accept:{"application/xml":[".soe"]}}]});
      const f=await h.getFile(); loadDoc(await readSoeFile(f),h); toast("Opened "+f.name); return; }
    catch(e){ if(e.name==="AbortError") return; }
  }

}
async function openFromFile(f){ try{ loadDoc(await readSoeFile(f)); toast("Opened "+f.name); }catch(e){ toast("Couldn't open "+f.name+": "+e.message,5000); } }
async function doSave(as){
  const bytes=serializeSoe(D);
  if(!as && fileHandle && fileHandle.createWritable){
    try{ if(fileHandle.requestPermission && (await fileHandle.requestPermission({mode:"readwrite"}))!=="granted") throw Object.assign(new Error("denied"),{name:"NotAllowedError"});

async function doPdf(kind){

/* ===================================================================== auto-recovery (IndexedDB) */
let idbP=null, persisted=new Set(), draftTimer=null, lastDraft=0;
function idb(){ if(!idbP) idbP=new Promise((res,rej)=>{ try{ const r=indexedDB.open("visual-instructor",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); return idbP; }
async function idbDo(mode,fn){ const db=await idb(); return new Promise((res,rej)=>{ const t=db.transaction("kv",mode), st=t.objectStore("kv"); let out; const r=fn(st); if(r&&"onsuccess" in r) r.onsuccess=()=>{ out=r.result; }; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
const idbGet=k=>idbDo("readonly",st=>st.get(k));
function scheduleDraft(fresh=false){ if(fresh){ persisted=new Set(); writeDraft(true); return; } clearTimeout(draftTimer); draftTimer=setTimeout(()=>writeDraft(false),700); }
async function writeDraft(fresh){ clearTimeout(draftTimer); draftTimer=null;
  try{ const meta={...D}; delete meta.images; const ids=Object.keys(D.images).filter(id=>!persisted.has(id));
    let handle=fileHandle; try{ structuredClone(handle); }catch(e){ handle=null; }
    await idbDo("readwrite",st=>{ if(fresh) st.clear(); for(const id of ids) st.put(D.images[id],"img:"+id); st.put({meta,dirty,handle,savedAt:Date.now()},"draft"); });
    ids.forEach(id=>persisted.add(id)); lastDraft=Date.now(); renderHeader();
  }catch(e){ console.warn("Auto-recovery unavailable",e); } }
async function restoreDraft(){
  try{ const dr=await idbGet("draft"); if(!dr||!dr.meta||!Array.isArray(dr.meta.tasks)) return false;
    const d={...blankDoc(),...dr.meta,images:{}}; const ids=new Set(d.tasks.map(t=>t.image_id).filter(Boolean)); if(d.logo_id) ids.add(d.logo_id);

function parseSteps(text){ const steps=[], loose=[]; let title="", numbered=false;
  const typeRe=/^(work\s*content|work|check|verify|safety|quality)$/i;
  const norm=s=>{ s=s.toLowerCase().replace(/\s+/g," "); return s.startsWith("work")?"Work Content":s[0].toUpperCase()+s.slice(1); };
  for(let raw of tidy(text).split(/\r?\n/)){ let s=raw.trim().replace(/^#+\s*/,"").replace(/^\*\*(.*)\*\*$/,"$1"); if(!s) continue;
    const tm=s.match(/^title\s*:\s*(.+)$/i); if(tm){ title=tm[1].trim(); continue; }
    if(/^document\s*:/i.test(s)) continue;
    const m=s.match(/^(?:step\s*)?(\d+)\s*[.):\-]\s*(.*)$/i) || s.match(/^[-*]\s+(.*)$/);
    if(!m){ if(steps.length&&numbered) steps[steps.length-1].caption+=" "+s; else if(!/^```/.test(s)) loose.push(s); continue; }
    numbered=true;
    let body=(m.length===3?m[2]:m[1]).replace(/\*\*|__/g,"").trim(), type="Work Content";
    let b=body.match(/^\[([^\]]+)\]\s*(.*)$/) || body.match(/^\(([^)]+)\)\s*(.*)$/) || body.match(/^([A-Za-z ]{4,12})\s*:\s*(.*)$/);

    case "undo": if(undoDel){ undoDel.forEach(([i,t])=>D.tasks.splice(i,0,t)); sel=new Set(undoDel.map(x=>x[0])); undoDel=null; changed(true); toast("Restored"); } break;
    case "up": { const ix=sorted(); if(ix[0]<=0) return; ix.forEach(i=>[T[i-1],T[i]]=[T[i],T[i-1]]); sel=new Set(ix.map(i=>i-1)); changed(true); break; }
    case "down": { const ix=sorted().reverse(); if(ix[0]>=T.length-1) return; ix.forEach(i=>[T[i+1],T[i]]=[T[i],T[i+1]]); sel=new Set(ix.map(i=>i+1)); changed(true); break; }
    case "logo": $("#logoInput").value=""; $("#logoInput").click(); break;
    case "nologo": D.logo_id=""; D.logo_path=""; changed(true); break;
    case "pppall": T.forEach(t=>t.pics_per_page=D.default_ppp); changed(true); toast("Applied to all rows"); break;
    case "revcopy": { const t=reviewText(); if(await copyText(t)) toast("Copied. Paste it into Copilot (Ctrl+V).",4000);
      else modal(`<h2>Copy for Copilot</h2><p>Select all (Ctrl+A) and copy (Ctrl+C):</p><textarea readonly>${esc(t)}</textarea><div class="acts"><button class="lbtn primary" data-x>Done</button></div>`,(d,c)=>{ d.querySelector("textarea").select(); d.querySelector("[data-x]").onclick=c; }); break; }
    case "revsave": { const base=(D.name||"untitled").replace(/\.soe$/i,""); const r=await saveBlob(base+" for Copilot.txt",new Blob(["\uFEFF"+reviewText().replace(/\n/g,"\r\n")],{type:"text/plain"}),[{description:"Text",accept:{"text/plain":[".txt"]}}]); if(r.status==="saved") toast("Saved "+r.name+". Attach it in Copilot.",4000); break; }
    case "resetcolors": ST.colors={...DEFAULT_COLORS}; saveSettings(); render(); break;
  } }
let undoDel=null;
function toastUndo(msg){ modalLess(msg); }
function modalLess(msg){ const t=$("#toast"); t.innerHTML=`${esc(msg)} <button class="lbtn" data-act="undo" style="margin-left:8px;pointer-events:auto">Undo</button>`; t.style.pointerEvents="auto"; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>{t.classList.remove("on"); t.style.pointerEvents="none";},6000); }

if(window.matchMedia&&matchMedia("(pointer:coarse)").matches){ $("#soeInput").removeAttribute("accept"); }
render();
restoreDraft();
</script>
