<style>
/* Layout: one-screen work tool. Dark toolbar band, tab strip, scrolling step grid, status line. */
:root{

}

  --accent:#4b8fe0; --accent-ink:#0b1320; --sel:#22344d; --danger:#ef8a80; --ok:#7cc47f; --focus:#7fb0ee; --edge:#7a879b; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{

  --bar:#0d1117; --bar-ink:#e7ebf1; --bar-btn:#222b38; --bar-line:#56647a;
  --accent:#4b8fe0; --accent-ink:#0b1320; --sel:#22344d; --danger:#ef8a80; --ok:#7cc47f; --focus:#7fb0ee; --edge:#7a879b; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--bar)}  /* so any home-indicator strip under the body matches the bottom bar, never a black gap */
@supports (height:100dvh){ body{height:100dvh} }
body{margin:0;font:13px/1.4 var(--font);color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bar :focus-visible,.mobbar :focus-visible{outline-color:#fff}
.bar{background:var(--bar);color:var(--bar-ink);padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}

.brand{font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}

.file .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffb020;margin-left:6px;vertical-align:middle}
.tb{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sep{width:1px;height:22px;background:var(--bar-line);margin:0 3px}

.tabs{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding-top:10px;padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex:none}

.thumb.drop{border-color:var(--accent);border-style:solid}
.thumb .x{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:3px;width:22px;height:22px;cursor:pointer;display:none}
.thumb:hover .x,.thumb:focus-within .x{display:block}
.typesel{display:flex;align-items:center;gap:6px}
.qchk{margin:6px 0 0;font-size:12px;color:var(--muted);white-space:nowrap}
select.s,input.f,textarea.cap{border:1px solid var(--edge);border-radius:6px;background:var(--panel);padding:4px 6px}

.capmeta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px;margin-top:4px;flex-wrap:wrap}
.ro{max-width:560px}
input.small{width:90px}
td.c,th.c{text-align:center}
tfoot td{font-weight:600;background:var(--panel2);border-top:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--edge);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg label{padding:4px 9px;cursor:pointer;border-right:1px solid var(--edge);white-space:nowrap;color:var(--muted)}
.seg label:last-child{border-right:none}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:#5f6b7a;color:#fff;font-weight:600}
.seg label.vVA:has(input:checked){background:var(--va)}
.seg label.vNVA:has(input:checked){background:var(--nva)}

.chart{padding:14px 16px}
.review{padding:16px 20px;max-width:900px;line-height:1.55}

.review ol{padding-left:28px;display:grid;gap:6px}
.review li{padding-left:4px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;border:1px solid var(--line)}
.chip.ok{color:var(--ok)}
.chip.miss{color:var(--muted)}
.chip.warn{color:#a15c00;border-color:#d99a3b}

.esgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:6px 16px;margin-top:8px}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:16px}

.chk{display:flex;gap:7px;align-items:center;margin:4px 0}

.lbtn.danger{color:var(--danger)}

.empty{padding:48px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--bar);color:var(--bar-ink);padding:9px 14px;border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;max-width:min(560px,80vw);z-index:50}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal[hidden]{display:none!important}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.dlg h2{margin:0 0 8px;font-size:16px}

.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:-18px;z-index:3;margin:12px -18px -18px;padding:12px 18px;background:var(--panel);border-top:1px solid var(--line);border-radius:0 0 10px 10px}
.revtools{display:flex;gap:8px;align-items:center;margin:4px 0 8px;flex-wrap:wrap}

.revrow:last-child{border-bottom:none}
.revrow:has(input:not(:checked)){opacity:.62}
.revck{display:flex;gap:6px;align-items:center;white-space:nowrap;font-size:12px;color:var(--muted);flex:none;cursor:pointer;user-select:none}
.revck input{width:18px;height:18px}
.revbody{flex:1;min-width:0;display:grid;gap:3px;line-height:1.4}

.revmeta svg{flex:none}
.rl{display:inline-block;min-width:34px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.revnow{color:var(--muted)}
.revnew{color:var(--ink)}
.revthumb{width:74px;height:50px;object-fit:cover;border:1px solid var(--line);border-radius:4px;flex:none}
.revthumb.nopic{display:flex;align-items:center;justify-content:center;background:var(--panel2);color:var(--muted);font-size:10px;text-align:center}
.menu{position:fixed;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 28px rgba(0,0,0,.2);z-index:30;min-width:230px;max-width:calc(100vw - 16px);padding:5px;overscroll-behavior:contain;max-height:calc(100dvh - 16px);overflow:auto}
.menu button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:none;background:none;padding:7px 10px;border-radius:6px;cursor:pointer;color:inherit;white-space:nowrap}
.menu button:hover,.menu button:focus-visible{background:var(--sel);outline:none}
.menu button small{margin-left:auto;color:var(--muted);font-size:11.5px}
.menu button.danger{color:var(--danger)}
.menu button:disabled{opacity:.45;cursor:default}
.menu .ck{width:16px;text-align:center;font-weight:700}
.menu .msep{border-top:1px solid var(--line2);margin:4px 2px}
.stepno{display:none}
.mobbar{display:none}
/* Phones and small tablets: steps become cards, toolbar swipes sideways, row tools sit at the bottom. */
@media (max-width:760px){
  body{font-size:15px}
  .bar{padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:6px}
  .bar-top .file{font-size:13px}
  .tb{flex-wrap:wrap;gap:6px}
  .lbl-full{display:none} .lbl-short{display:inline}
  .tb::-webkit-scrollbar{display:none}
  .tb .rowtool,.tb .sep{display:none}
  .btn{padding:8px 12px;font-size:14px}
  .tabs button{padding:9px 14px}
  main{border-radius:0 7px 0 0}
  .status{display:none}
  .mobbar{display:grid;grid-template-columns:repeat(6,1fr);background:var(--bar);border-top:1px solid var(--bar-line);padding-top:3px;padding-bottom:calc(3px + env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);flex:none}
  .mobbar button{background:none;border:none;color:var(--bar-ink);padding:6px 2px;font-size:19px;line-height:1.1;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
  .mobbar button span{font-size:11px;opacity:.85}
  .mobbar button:disabled{opacity:.35}
  input,select,textarea,.f,.s,textarea.cap{font-size:16px!important}
  select.s,input.f{min-height:40px}
  .scard{grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px}
  .scard .thumb{width:100%;height:auto;aspect-ratio:16/10;max-height:260px}
  .scard .sbody{grid-column:1/-1}
  .scard textarea.cap{min-height:84px}
  select.pill,.tog{min-height:36px;font-size:14px!important}
  .tabs{padding-top:8px;padding-bottom:8px} .tabs .tab-set{margin-left:auto}
  main{padding-bottom:12px}
  .grid thead{display:none}
  .grid,.grid tbody,.grid tfoot{display:block;width:100%}
  .grid tr{display:flex;flex-wrap:wrap;gap:8px 10px;padding:12px 14px;border-bottom:8px solid var(--bg);background:var(--panel)}
  .grid tr.sel{box-shadow:inset 4px 0 0 var(--accent)}
  .grid tr.sel td{background:transparent}
  .grid td{display:block;border:none;padding:0;flex:1 1 100%;min-width:0}
  .grid td[data-label]::before{content:attr(data-label);display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
  .grid td.num{flex:1 1 100%;width:auto;text-align:left;font-size:15px;color:var(--ink);padding:2px 0}
  .stepno{display:inline}
  .grid td.half{flex:1 1 calc(50% - 5px)}
  .grid td.half select{width:100%}
  .grid td.c{flex:0 0 auto;display:flex;flex-direction:row-reverse;align-items:center;justify-content:flex-end;gap:6px;border:1px solid var(--line);border-radius:6px;padding:7px 10px}
  .grid td.c::before{margin:0!important;font-size:12px!important;text-transform:none!important;letter-spacing:0!important;color:var(--ink)!important;font-weight:500!important}
  .grid td.c input{width:20px;height:20px;margin:0}
  .grid td.ro{font-weight:500;max-width:none}
  .grid tfoot tr{border-bottom:none} .grid tfoot td:empty{display:none}
  .thumb .x{display:block;width:34px;height:34px;font-size:18px}
  .typesel{gap:8px} .typesel select{flex:1}
  textarea.cap{min-height:84px}
  .capmeta{font-size:13px}
  .seg label{padding:8px 10px}
  .opts{padding:12px} .card{padding:12px}
  .fr{grid-template-columns:1fr}
  .review{padding:14px}
  .revbar .lbtn,.lbtn{padding:8px 12px}
  .chart{padding:12px}
  .dlg{padding:14px;max-height:calc(100dvh - 32px)}
  .dlg .acts{bottom:-14px;margin:10px -14px -14px;padding:10px 14px}
  .dlg textarea{min-height:180px}
  .toast{bottom:calc(70px + env(safe-area-inset-bottom,0px));left:16px;right:16px;max-width:none}
  .menu{left:8px!important;right:8px;min-width:0}
  .menu button{padding:12px 14px}
}
@media (max-width:760px) and (orientation:landscape){ .thumb{max-height:180px} }
/* Tablets / touch laptops (iPad included): keep the desktop table but make it finger-friendly. */
@media (pointer:coarse) and (min-width:761px){
  .thumb .x{display:block;width:30px;height:30px;font-size:17px}
  input,select,textarea,input.f,select.s,textarea.cap{font-size:16px}   /* 16px stops iOS zoom-on-focus */
  .btn{padding:7px 12px}
  .grid td{padding:9px 8px}
  .grid td.num{font-size:15px}
  .tabs button{padding:9px 16px}
  .lbtn{padding:8px 13px}
  .seg label{padding:8px 11px}
  textarea.cap{min-height:82px}
  select.s,input.f{min-height:38px}
  .menu button{padding:10px 14px}
}
/* Desktop-only on touch (phones + tablets): analysis/Spanish tabs and their toolbar actions. */
@media (pointer:coarse){ .tabs .tab-adv,.tb .adv{display:none} .tb .sep{display:none} }
/* ---- Steps as cards ---- */
.cards{display:grid;gap:10px}
.scard{display:grid;grid-template-columns:48px 190px minmax(0,1fr);gap:14px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.scard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--sel)}
.scard.dragover{box-shadow:0 -3px 0 0 var(--accent)}
.scard.dragover.below{box-shadow:0 3px 0 0 var(--accent)}
.snum{display:flex;flex-direction:column;align-items:center;gap:6px}
.selbtn{border:none;background:none;padding:2px;border-radius:8px;cursor:pointer;line-height:0}
.handle{color:var(--nva);font-size:15px;letter-spacing:-2px;cursor:grab;user-select:none;padding:2px 6px;border-radius:5px}
.handle:hover{background:var(--line2)}
.scard .thumb{width:190px;height:118px;border-radius:8px}
.sbody{display:flex;flex-direction:column;gap:7px;min-width:0}
.scard textarea.cap{font-size:15px;line-height:1.4;min-height:58px;padding:8px 10px;border-radius:8px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pw{position:relative;display:inline-flex;align-items:center}
.pw .dot{position:absolute;left:11px;width:9px;height:9px;border-radius:2px;pointer-events:none}
select.pill{border:1px solid var(--edge);border-radius:999px;background:var(--panel2);padding:3px 8px 3px 10px;font-size:12.5px;cursor:pointer;min-height:28px}
.pw select.pill{padding-left:26px;font-weight:600}
.pill-lbl{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
input.pill.code{border:1px solid var(--edge);border-radius:999px;background:var(--panel2);color:var(--ink);padding:3px 10px;font:inherit;font-size:12.5px;min-height:28px;width:10.5em}
.tog{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--edge);border-radius:999px;padding:3px 10px 3px 8px;font-size:12.5px;color:var(--muted);background:var(--panel2);cursor:pointer;white-space:nowrap;min-height:28px}
.tog input{margin:0;width:14px;height:14px;accent-color:var(--ink)}
.tog:has(input:checked){border-color:var(--ink);color:var(--ink);background:var(--panel);font-weight:600}
.tog.q:has(input:checked){border-color:#3e9a6a;background:#e8f6ee;color:#11633a}
.tog.q input{accent-color:#11633a}
.tog:has(input:disabled){opacity:.7;cursor:default}
.tog:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.imgname{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.stepbar{position:sticky;top:0;z-index:5;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 0 10px;background:var(--bg)}
.stepbar .lbtn{background:var(--panel)} .stepbar .lbtn.primary{background:var(--accent)}
.stepbar .lbtn:disabled{opacity:.45;cursor:default}
.sbsep{width:1px;height:22px;background:var(--line);margin:0 4px}
.sbinfo{font-weight:600;color:var(--ink);margin-right:2px;font-variant-numeric:tabular-nums}
.sbtip{margin-left:auto}
@media (pointer:coarse){ .sbtip{display:none} }
@media (max-width:760px){ .stepbar{display:none} }   /* phones use the bottom bar instead */
.addcard{border:1.5px dashed var(--edge);border-radius:10px;padding:12px;text-align:center;color:var(--accent);font-weight:600;background:var(--panel2);cursor:pointer;width:100%;font-size:14px}
.addcard:hover{background:var(--sel)}
@media (pointer:coarse){ .handle{display:none} }
/* ---- Analysis ---- */
.an{display:grid;gap:10px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px}
.kpi small{display:block;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.kpi b{font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12.5px;color:var(--muted);font-weight:600;margin-left:6px;font-variant-numeric:tabular-nums}
.antab{overflow-x:auto}
.antab table.grid th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.antab .grid td{vertical-align:middle}
.antab td.ro{max-width:260px;min-width:160px}
.antab input.f.t{width:64px;text-align:right;font-variant-numeric:tabular-nums}
.antab .seg{flex-wrap:nowrap}
.antab .seg label{padding:3px 9px;font-size:12.5px}
.wl{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.wchip{border:1px solid #f0b35a;background:#fff4e5;color:#8a4b00;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.wchip:hover{border-color:#8a4b00}
.wadd{border:1px dashed var(--edge);background:none;color:var(--muted);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;white-space:nowrap}
.wadd:hover{color:var(--ink);border-style:solid}
.anfoot{padding:8px 12px;border-top:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:12.5px}
.tchart{padding:12px 14px}
.tchart h3{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.crow{display:flex;align-items:center;gap:8px;min-height:18px;margin:3px 0;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.crow .cn{width:18px;text-align:right;flex:none}
.ctrack{flex:1;display:flex;align-items:center;gap:8px;min-width:0;max-width:calc(100% - 200px)}
.cbar{height:12px;border-radius:3px;flex:none}
.clab{white-space:nowrap;flex:none}
.ppegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;padding:2px;margin-top:4px}
.ppetile{border:2px solid var(--line);border-radius:9px;padding:9px 6px;cursor:pointer;background:var(--panel);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font:inherit}
.ppetile svg{width:54px;height:54px;flex:none}
.ppetile .pl{font-size:11px;font-weight:600;line-height:1.2}
.ppetile:hover{border-color:var(--focus)}
.ppetile.on{border-color:var(--accent);background:var(--sel)}
.ppetile.on .pl{color:var(--accent)}
@media (pointer:coarse){ .ppetile{padding:11px 6px} .ppetile svg{width:60px;height:60px} }
@media (max-width:760px){ .ppegrid{grid-template-columns:repeat(3,1fr);gap:6px} .ppetile{padding:8px 3px} .ppetile svg{width:50px;height:50px} }
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
/* ---- Phones: one toolbar row, short tab names, and a compact step card that fits on one screen ---- */
@media (max-width:760px){
  .bar{gap:6px;padding-top:calc(6px + env(safe-area-inset-top,0px));padding-bottom:8px}
  .bar-top{flex-basis:100%;gap:8px} .brand{font-size:15px} .mark{width:18px;height:18px}
  .tb{display:flex;flex-wrap:nowrap;width:100%;gap:6px}
  .tb .btn{flex:1 1 auto;padding:6px 6px;font-size:14px;text-align:center;min-height:38px;white-space:nowrap}
  .tabs{flex-wrap:nowrap;gap:2px;padding-top:6px;padding-bottom:6px}
  .tabs button{padding:6px 12px;font-size:15px}
  main{padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .cards{gap:8px}
  .scard{grid-template-columns:34px minmax(0,1fr);gap:8px;padding:8px 10px 10px}
  .snum{gap:4px} .selbtn svg{width:32px;height:32px}
  .scard .thumb{width:100%;height:auto;aspect-ratio:16/10;max-height:min(28vh,190px);border-radius:7px}
  .scard textarea.cap{min-height:60px;padding:7px 9px}
  .meta{gap:6px}
  select.pill{font-size:16px!important;min-height:34px;padding-top:2px;padding-bottom:2px}
  input.pill.code{font-size:16px!important;min-height:34px;width:9em}
  .pw select.pill{padding-left:24px}
  .tog{font-size:13.5px!important;min-height:34px;padding:2px 10px 2px 8px}
  .pill-lbl .tl,.imgname{display:none}
  .addcard{padding:10px}
  select.pill{padding:2px 2px 2px 8px} .pw select.pill{padding-left:22px} .pw .dot{left:9px}
}
@media (max-width:760px) and (pointer:fine){ .tb,.tabs{flex-wrap:wrap} }   /* narrow desktop windows show more buttons and tabs */
@media (max-width:360px){   /* smallest phones / Display Zoom: keep each card to three short rows */
  .pw select.pill{max-width:142px}
  .tog{font-size:12px!important;padding:2px 7px 2px 5px;gap:4px}
  .meta{gap:5px}
}
